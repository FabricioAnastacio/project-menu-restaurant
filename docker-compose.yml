services:
  frontend:
    container_name: app_frontend_menu
    build: ./frontend-menu
    ports:
      - 3000:3000
    working_dir: /app-frontend-menu
    healthcheck:
      test: ["CMD", "lsof", "-t", "-i:3000"]
      timeout: 10s
      retries: 5
  backend:
    container_name: backend
    build: ./backend
    ports:
      -3001:3001
    working_dir: /backend
    command: dev
    volumes:
      - ./backend/src:/backend/src
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_PORT=3001
      - JWT_SECRET=jwt_iogurt
      - DB_USER=root
      - DB_PASS=679301
      - DB_HOST=dbdlibre
      - DB_PORT=3306
    healthcheck:
      test: ["CMD", "lsof", "-t", "-i:3001"]
      timeout: 10s
      retries: 5
  db:
    image: mysql:8.0.32
    container_name: dbdlibre
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=679301
    restart: 'always'
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
    cap_add:
      - SYS_NICE